<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Entdecke Konzerte, Festivals und weitere Events in deiner Region mit EventHub."
  >

  <title>EventHub – Deine Events in deiner Region</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>

<body>
  <a class="skip-link" href="#inhalt">Zum Inhalt springen</a>

  <div class="site-wrapper">

    <header class="site-header">
      <a
        class="logo"
        href="index.html"
        aria-label="EventHub – Startseite"
      >
        <svg
          class="logo-icon"
          viewBox="0 0 32 24"
          fill="none"
          aria-hidden="true"
        >
          <g transform="rotate(-18 16 12)">
            <path d="M3 5h26v5a2 2 0 0 0 0 4v5H3v-5a2 2 0 0 0 0-4V5Z" />
            <path d="M21 6v3m0 2v2m0 2v3" />
          </g>
        </svg>

        <span>EventHub</span>
      </a>

      <nav
        class="navigation header-navigation"
        aria-label="Hauptnavigation"
      >
        <a href="impressum.html">Impressum</a>
        <a href="kontakt.html">Kontakt</a>
        <a href="agb.html">AGB</a>
        <a href="datenschutz.html">Datenschutz</a>
      </nav>
    </header>

    <main id="inhalt">

      <section class="hero" aria-labelledby="hero-title">
        <img
          class="hero-image"
          src="images/Startseite_Bild.png"
          alt=""
          fetchpriority="high"
        >

        <div class="hero-content">
          <h1 id="hero-title">
            Deine Events<br>
            in deiner Region.
          </h1>

          <p>
            Konzerte, Festivals und mehr. Hier einfach Tickets finden!
          </p>

          <div class="event-filter">

            <!-- Bestehender Bundeslandfilter -->
            <label class="region-filter" for="bundesland">
              <svg
                class="location-icon"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z" />
                <circle cx="12" cy="10" r="2" />
              </svg>

              <span class="sr-only">
                Events nach Bundesland filtern
              </span>

              <select id="bundesland" name="bundesland">
                <option value="">Bundesland auswählen</option>
                <option value="Baden-Württemberg">Baden-Württemberg</option>
                <option value="Bayern">Bayern</option>
                <option value="Berlin">Berlin</option>
                <option value="Brandenburg">Brandenburg</option>
                <option value="Bremen">Bremen</option>
                <option value="Hamburg">Hamburg</option>
                <option value="Hessen">Hessen</option>
                <option value="Mecklenburg-Vorpommern">Mecklenburg-Vorpommern</option>
                <option value="Niedersachsen">Niedersachsen</option>
                <option value="Nordrhein-Westfalen">Nordrhein-Westfalen</option>
                <option value="Rheinland-Pfalz">Rheinland-Pfalz</option>
                <option value="Saarland">Saarland</option>
                <option value="Sachsen">Sachsen</option>
                <option value="Sachsen-Anhalt">Sachsen-Anhalt</option>
                <option value="Schleswig-Holstein">Schleswig-Holstein</option>
                <option value="Thüringen">Thüringen</option>
              </select>

              <svg
                class="chevron-icon"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path d="m6 9 6 6 6-6" />
              </svg>
            </label>

            <!-- Kategorien werden aus SQLite geladen -->
            <label class="region-filter" for="kategorie">
              <svg
                class="location-icon"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path d="M9 6h12M9 12h12M9 18h12M3 6h1M3 12h1M3 18h1" />
              </svg>

              <span class="sr-only">
                Events nach Kategorie filtern
              </span>

              <select id="kategorie" name="kategorie" disabled>
                <option value="">Kategorien werden geladen …</option>
              </select>

              <svg
                class="chevron-icon"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path d="m6 9 6 6 6-6" />
              </svg>
            </label>

          </div>

          <p
            id="kategorie-status"
            class="filter-message"
            role="alert"
            hidden
          ></p>

          <p id="auswahl-vorschau"></p>
        </div>
      </section>

      <section class="events" aria-label="Verfügbare Events">

        <div class="event-grid" aria-busy="true"></div>

        <!-- JavaScript kopiert diese Vorlage für jedes geladene Event -->
        <template id="event-karten-vorlage">
          <article class="event-card">
            <img
              class="event-image"
              alt=""
              width="1448"
              height="1086"
              loading="lazy"
            >

            <div class="event-content">
              <time class="event-date"></time>
              <h2></h2>
              <p class="event-city"></p>
              <p class="event-price"></p>
              <a class="details-button">Details</a>
            </div>
          </article>
        </template>

        <p
          id="filter-status"
          class="sr-only"
          role="status"
          aria-live="polite"
        ></p>

        <p id="keine-events" class="empty-message">
          Events werden geladen …
        </p>

      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 EventHub</p>

      <nav class="navigation" aria-label="Fußnavigation">
        <a href="impressum.html">Impressum</a>
        <a href="kontakt.html">Kontakt</a>
        <a href="agb.html">AGB</a>
        <a href="datenschutz.html">Datenschutz</a>
      </nav>
    </footer>

  </div>

  <noscript>
    <p class="empty-message">
      Bitte aktiviere JavaScript, um Veranstaltungen zu laden und zu filtern.
    </p>
  </noscript>
</body>
</html>
