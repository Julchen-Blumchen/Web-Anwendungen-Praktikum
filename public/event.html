<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Entdecke alle Informationen zu deinem Event bei EventHub."
  >

  <title>Eventdetails – EventHub</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>

<body>
  <a class="skip-link" href="#inhalt">
    Zum Inhalt springen
  </a>

  <div class="site-wrapper">

    <header class="site-header">
      <a
        class="logo"
        href="index.html"
        aria-label="EventHub – Startseite"
      >
        <svg
          class="logo-icon"
          viewBox="0 0 32 24"
          fill="none"
          aria-hidden="true"
        >
          <g transform="rotate(-18 16 12)">
            <path d="M3 5h26v5a2 2 0 0 0 0 4v5H3v-5a2 2 0 0 0 0-4V5Z" />
            <path d="M21 6v3m0 2v2m0 2v3" />
          </g>
        </svg>

        <span>EventHub</span>
      </a>
    </header>

    <main id="inhalt" class="event-detail">

      <a href="index.html" class="detail-zurueck">
        ← Zurück zur Übersicht
      </a>

      <p
        id="detail-status"
        class="detail-status"
        role="status"
        aria-live="polite"
      >
        Event wird geladen …
      </p>

      <!-- Erst nach erfolgreichem API-Aufruf sichtbar -->
      <div id="event-inhalt" hidden>

        <img
          id="detail-bild"
          class="detail-bild"
          alt=""
        >

        <h1 id="detail-name"></h1>

        <section
          class="detail-infos"
          aria-label="Eventinformationen"
        >
          <p>
            <svg
              class="detail-icon"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <rect x="3" y="5" width="18" height="16" rx="2" />
              <path d="M7 3v4M17 3v4M3 10h18" />
              <path d="M7 14h2M12 14h2M7 18h2M12 18h2" />
            </svg>

            <time id="detail-datum"></time>
          </p>

          <p>
            <svg
              class="detail-icon"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" />
              <circle cx="12" cy="10" r="2.5" />
            </svg>

            <span id="detail-ort"></span>
          </p>

          <p>
            <svg
              class="detail-icon"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path d="M3 5h18v5a2 2 0 0 0 0 4v5H3v-5a2 2 0 0 0 0-4V5Z" />
              <path d="M15 6v3m0 2v2m0 2v3" />
            </svg>

            <span id="detail-preis"></span>
          </p>
        </section>

        <section
          class="detail-beschreibung"
          aria-label="Beschreibung"
        >
          <p id="detail-text"></p>
        </section>

        <a id="detail-buchen" class="detail-button">
          Ticket buchen →
        </a>

      </div>

      <noscript>
        <p>
          Bitte aktiviere JavaScript, um die Veranstaltungsdetails zu laden.
        </p>
      </noscript>

    </main>

    <footer class="site-footer">
      <p>© 2026 EventHub</p>

      <nav class="navigation" aria-label="Fußnavigation">
        <a href="impressum.html">Impressum</a>
        <a href="kontakt.html">Kontakt</a>
        <a href="agb.html">AGB</a>
        <a href="datenschutz.html">Datenschutz</a>
      </nav>
    </footer>

  </div>
</body>
</html>
